name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Test
        run: CGO_ENABLED=0 go test ./...

      - name: Build
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/daemon/
